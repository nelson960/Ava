services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ava
      POSTGRES_USER: ava
      POSTGRES_PASSWORD: ava-local-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ava -d ava"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ./supabase/migrations/202608010001_create_ava_realtime_memory.sql:/docker-entrypoint-initdb.d/001-realtime-memory.sql:ro
      - ava_postgres_data:/var/lib/postgresql/data

volumes:
  ava_postgres_data:
