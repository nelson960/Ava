name: ava
description: "Interactive AI character teacher for iPadOS, iOS, and macOS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  path_provider: ^2.1.3
  path: ^1.9.0
  crypto: ^3.0.7
  vector_math: ^2.1.4
  thermion_flutter: 0.4.1
  flutter_3d_controller: ^2.3.0
  flutter_inappwebview: ^6.1.5
  flutter_webrtc: ^1.5.2
  share_plus: ^10.1.4
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/
    - avatar/ava_vroid_source.glb
    - avatar/ava_touch_map.json
    - avatar/ava_reaction_motion_profiles.json
    - avatar/ava_rig_bindings.json
    - avatar/ava_motion_manifest.json
